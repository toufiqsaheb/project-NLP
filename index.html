<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Sentiment Analysis</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Raleway:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #FFDEE9, #FF80AB, #E040FB);
            color: #1C1C1C;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(255, 64, 129, 0.3);
            text-align: center;
            width: 420px;
            border: 1px solid rgba(255, 64, 129, 0.3);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #E040FB;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            font-size: 15px;
            color: #444;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 64, 129, 0.1);
            color: #000;
            outline: none;
            resize: none;
            transition: 0.3s;
            font-family: 'Raleway', sans-serif;
        }

        textarea::placeholder {
            color: rgba(50, 50, 50, 0.6);
            font-size: 14px;
        }

        textarea:focus {
            box-shadow: 0px 0px 15px rgba(255, 64, 129, 0.5);
        }

        button {
            background: linear-gradient(135deg, #FF4081, #E040FB);
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0px 5px 15px rgba(255, 64, 129, 0.5);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0px 5px 20px rgba(255, 64, 129, 0.8);
        }

        /* Floating Twitter Icons Animation */
        .floating-icons {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .floating-icons span {
            position: absolute;
            display: block;
            width: 30px;
            height: 30px;
            background: url('c:\users\admin\OneDrive\Desktop\twitter.png');
            background-size: cover;
            opacity: 0.2;
            animation: floatIcons 10s ease-in-out infinite;
        }

        @keyframes floatIcons {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0.1;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0.4;
            }
        }

        .floating-icons span:nth-child(even) {
            animation-duration: 12s;
        }

        .floating-icons span:nth-child(odd) {
            animation-duration: 8s;
        }

        /* Randomized icon positioning */
        .floating-icons span {
            animation-delay: -3s;
            left: calc(50% - 15px);
            top: calc(50% - 15px);
        }

        .floating-icons span:nth-child(1) {
            top: 10%;
            left: 30%;
        }

        .floating-icons span:nth-child(2) {
            top: 30%;
            left: 70%;
        }

        .floating-icons span:nth-child(3) {
            top: 50%;
            left: 20%;
        }

        .floating-icons span:nth-child(4) {
            top: 70%;
            left: 50%;
        }

        .floating-icons span:nth-child(5) {
            top: 80%;
            left: 80%;
        }

        .floating-icons span:nth-child(6) {
            top: 40%;
            left: 10%;
        }

        /* Responsive */
        @media (max-width: 450px) {
            .container {
                width: 90%;
                padding: 25px;
            }
        }
    </style>
</head>
<body>

    <div class="floating-icons">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="container">
        <h1>Twitter Sentiment Analysis</h1>
        <p>Analyze the sentiment of tweets in real-time using AI-powered analysis.</p>
        <form action="/predict" method="POST">
            <textarea name="message" placeholder="Enter your tweet..." required></textarea>
            <button type="submit">Predict Sentiment</button>
        </form>
    </div>

    <script>
        // Function to generate floating Twitter icons
        function createFloatingIcons() {
            const iconContainer = document.querySelector(".floating-icons");
            for (let i = 0; i < 15; i++) {
                let span = document.createElement("span");
                let size = Math.random() * 30 + 20;
                let leftPos = Math.random() * 100;
                let duration = Math.random() * 10 + 5;
                
                span.style.width = size + "px";
                span.style.height = size + "px";
                span.style.left = leftPos + "%";
                span.style.animationDuration = duration + "s";
                
                iconContainer.appendChild(span);
            }
        }

        createFloatingIcons();
    </script>

</body>
</html>
