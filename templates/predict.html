<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: rgba(20, 20, 20, 0.9);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px #0ff;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: #0ff;
            font-size: 16px;
            outline: none;
            resize: none;
            box-shadow: 0 0 10px #0ff;
            transition: all 0.3s;
        }

        textarea:focus {
            box-shadow: 0 0 20px #0ff;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #0ff;
            color: #000;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 10px #0ff;
            transition: all 0.3s;
        }

        button:hover {
            box-shadow: 0 0 20px #0ff;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sentiment Analysis</h2>
        <form action="/predict" method="post">
            <textarea name="message" placeholder="Enter your message..."></textarea>
            <br>
            <button type="submit">Analyze Sentiment</button>
        </form>
    </div>
</body>
</html>
