<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twitter Sentiment Analysis</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Custom CSS -->
  <style>
    /* Background gradient and font style */
    body {
      background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
    }

    .container {
      margin-top: 20px;
      margin-bottom: 20px;
    }

    /* Card styles with smooth hover animation */
    .card {
      background: rgba(255, 255, 255, 0.9);
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease-in-out;
    }

    .card:hover {
      transform: scale(1.03);
    }

    /* Input and button styling */
    .form-control {
      border-radius: 50px;
      border: none;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .btn-predict {
      background: #ff6f61;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 10px 30px;
      transition: background 0.3s ease;
    }

    .btn-predict:hover {
      background: #ff3b2e;
    }

    /* Fade in animation */
    .animate-fade-in {
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container animate-fade-in">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card p-4">
          <h2 class="text-center mb-4">Twitter Sentiment Analysis</h2>
          <div class="form-group">
            <label for="tweetInput">Enter Tweet or Keyword</label>
            <input
              type="text"
              class="form-control"
              id="tweetInput"
              placeholder="Type your tweet or keyword..."
            />
          </div>
          <div class="text-center">
            <button id="predictBtn" class="btn btn-predict btn-lg">Predict</button>
          </div>
          <div id="result" class="mt-4 text-center"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS and dependencies -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  
  <!-- Custom JS -->
  <script>
    document.getElementById("predictBtn").addEventListener("click", function () {
      const tweetInput = document.getElementById("tweetInput").value;
      
      if (tweetInput.trim() === "") {
        alert("Please enter a tweet or keyword!");
        return;
      }
      
      // Show a loading message (simulate sentiment analysis)
      document.getElementById("result").innerHTML = "<h4>Analyzing sentiment...</h4>";
      
      // Simulate API call delay
      setTimeout(function () {
        // Dummy sentiment result (replace with your API call)
        const sentiments = ["Positive", "Negative", "Neutral"];
        const randomSentiment =
          sentiments[Math.floor(Math.random() * sentiments.length)];
        document.getElementById("result").innerHTML =
          "<h4>Sentiment: " + randomSentiment + "</h4>";
      }, 2000);
    });
  </script>
</body>
</html>
