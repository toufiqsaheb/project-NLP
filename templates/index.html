<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Sentiment Analysis</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
    <style>
        body {
            background: linear-gradient(45deg, #ff9a9e, #fad0c4, #fad0c4, #ffdde1);
            font-family: Arial, sans-serif;
            text-align: center;
            color: #fff;
            animation: backgroundAnimation 10s infinite alternate;
        }
        .container {
            margin-top: 100px;
        }
        .animated-title {
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.3);
            animation: fadeIn 2s ease-in-out;
        }
        .description {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .analyze-btn {
            background: #ff4b5c;
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.3s ease-in-out, background 0.3s ease-in-out;
        }
        .analyze-btn:hover {
            background: #ff1e3c;
            transform: scale(1.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes backgroundAnimation {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="animated-title">Twitter Sentiment Analysis</h1>
        <p class="description">Analyze the sentiment of tweets in real-time using advanced AI models.</p>
        <button class="analyze-btn" onclick="predictSentiment()">Analyze Sentiment</button>
    </div>
</body>
</html>
