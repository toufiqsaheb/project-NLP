<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twitter Sentiment Analysis</title>
  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
    }
    .container {
      margin-top: 20px;
      margin-bottom: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease-in-out;
    }
    .card:hover {
      transform: scale(1.03);
    }
    .form-control {
      border-radius: 50px;
      border: none;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    .btn-predict {
      background: #ff6f61;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 10px 30px;
      transition: background 0.3s ease;
    }
    .btn-predict:hover {
      background: #ff3b2e;
    }
    .animate-fade-in {
      animation: fadeIn 2s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container animate-fade-in">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card p-4">
          <h2 class="text-center mb-4">Twitter Sentiment Analysis</h2>
          <div class="form-group">
            <label for="tweetInput">Enter Tweet or Keyword</label>
            <input type="text" class="form-control" id="tweetInput" placeholder="Type your tweet or keyword..." />
          </div>
          <div class="text-center">
            <button id="predictBtn" class="btn btn-predict btn-lg">Predict</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("predictBtn").addEventListener("click", function () {
      const tweetInput = document.getElementById("tweetInput").value;
      if (tweetInput.trim() === "") {
        alert("Please enter a tweet or keyword!");
        return;
      }
      window.location.href = `/predict?tweet=${encodeURIComponent(tweetInput)}`;
    });
  </script>
</body>
</html>
